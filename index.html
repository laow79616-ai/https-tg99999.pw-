<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分布式机器人管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #0a1628; color: #fff; min-height: 100vh; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #00d4ff; font-size: 28px; margin-bottom: 8px; }
        .header p { color: #8899aa; font-size: 14px; }
        
        .stats-section { background: #1a2744; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .stats-section h3 { color: #00d4ff; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; }
        .stat-card { background: #0d1b2a; border-radius: 8px; padding: 15px; text-align: center; }
        .stat-card .number { font-size: 28px; font-weight: bold; color: #00d4ff; }
        .stat-card .label { font-size: 12px; color: #8899aa; margin-top: 5px; }
        
        .lines-section { background: #1a2744; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .lines-section h3 { color: #ff6b35; margin-bottom: 15px; }
        .lines-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .line-tag { padding: 8px 15px; border-radius: 6px; font-size: 13px; display: flex; gap: 15px; align-items: center; }
        .line-tag .line-name { font-weight: bold; }
        .line-tag .line-info { color: #ccc; font-size: 12px; }
        .line-1 { background: #1a3a5c; border-left: 3px solid #00d4ff; }
        .line-2 { background: #1a3a5c; border-left: 3px solid #ff6b35; }
        .line-3 { background: #1a3a5c; border-left: 3px solid #00cc66; }
        .line-4 { background: #1a3a5c; border-left: 3px solid #9b59b6; }
        .line-5 { background: #1a3a5c; border-left: 3px solid #f39c12; }
        .line-6 { background: #1a3a5c; border-left: 3px solid #e74c3c; }
        .line-7 { background: #1a3a5c; border-left: 3px solid #1abc9c; }
        .line-8 { background: #1a3a5c; border-left: 3px solid #3498db; }
        .line-9 { background: #1a3a5c; border-left: 3px solid #e67e22; }
        .line-10 { background: #1a3a5c; border-left: 3px solid #95a5a6; }
        
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.3s; }
        .btn-add { background: linear-gradient(135deg, #ff4444, #ff6b35); color: #fff; }
        .btn-batch { background: #ff6b35; color: #fff; }
        .btn-check { background: #9b59b6; color: #fff; }
        .btn-start { background: linear-gradient(135deg, #00cc66, #00d4ff); color: #fff; }
        .btn-refresh { background: #2c3e50; color: #fff; border: 1px solid #00d4ff; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .status-info { margin-left: auto; color: #8899aa; font-size: 13px; }
        
        .bot-list { background: #1a2744; border-radius: 12px; padding: 20px; }
        .bot-list h3 { color: #00d4ff; margin-bottom: 15px; }
        .bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
        .bot-card { background: #0d1b2a; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #00cc66; }
        .bot-card.error { border-left-color: #ff4444; }
        .bot-card.stopped { border-left-color: #f39c12; }
        .bot-card .bot-info { flex: 1; }
        .bot-card .bot-number { font-weight: bold; color: #00d4ff; }
        .bot-card .bot-username { font-size: 12px; color: #8899aa; }
        .bot-card .bot-stats { font-size: 11px; color: #666; }
        .bot-card .bot-actions { display: flex; gap: 5px; }
        .bot-card .btn-sm { padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-del { background: #ff4444; color: #fff; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1a2744; border-radius: 12px; padding: 30px; width: 90%; max-width: 500px; }
        .modal-content h3 { color: #00d4ff; margin-bottom: 20px; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #2c3e50; background: #0d1b2a; color: #fff; margin-bottom: 15px; font-size: 14px; }
        .modal-content textarea { height: 200px; resize: vertical; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        
        .error-msg { color: #ff4444; text-align: center; padding: 20px; }
        .success-msg { color: #00cc66; text-align: center; padding: 10px; }
        .loading { color: #f39c12; text-align: center; padding: 20px; }
        
        .refresh-btn-sm { background: none; border: 1px solid #00d4ff; color: #00d4ff; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        .check-section { background: #1a2744; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .check-section h3 { color: #9b59b6; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .check-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .check-stat { background: #0d1b2a; border-radius: 8px; padding: 12px; text-align: center; }
        .check-stat .num { font-size: 24px; font-weight: bold; }
        .check-stat .num.ok { color: #00cc66; }
        .check-stat .num.fixed { color: #f39c12; }
        .check-stat .num.failed { color: #ff4444; }
        .check-stat .lbl { font-size: 11px; color: #8899aa; margin-top: 3px; }
        .check-time { color: #8899aa; font-size: 12px; }
        .check-details { max-height: 200px; overflow-y: auto; margin-top: 10px; }
        .check-detail-item { display: flex; align-items: center; gap: 8px; padding: 4px 8px; font-size: 12px; border-bottom: 1px solid #0d1b2a; }
        .check-detail-item .dot { width: 8px; height: 8px; border-radius: 50%; }
        .check-detail-item .dot.ok { background: #00cc66; }
        .check-detail-item .dot.fixed { background: #f39c12; }
        .check-detail-item .dot.failed { background: #ff4444; }
        .btn-check-now { background: linear-gradient(135deg, #9b59b6, #8e44ad); color: #fff; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-check-now:hover { opacity: 0.9; }
        .btn-check-now:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">
        <h1>分布式机器人管理系统</h1>
        <p>10条代理线路 · 每线路30Bot · 按编号自动分配 · 总容量300个</p>
    </div>

    <div class="stats-section">
        <h3>广告发送统计（全局汇总）<button class="refresh-btn-sm" onclick="refreshStats()">刷新统计</button></h3>
        <div class="stats-grid">
            <div class="stat-card"><div class="number" id="stat-total">0</div><div class="label">累计总发送</div></div>
            <div class="stat-card"><div class="number" id="stat-today">0</div><div class="label">今日发送</div></div>
            <div class="stat-card"><div class="number" id="stat-success">0</div><div class="label">成功总数</div></div>
            <div class="stat-card"><div class="number" id="stat-failed" style="color:#ff4444">0</div><div class="label">失败总数</div></div>
            <div class="stat-card"><div class="number" id="stat-today-success">0</div><div class="label">今日成功</div></div>
            <div class="stat-card"><div class="number" id="stat-today-failed" style="color:#ff4444">0</div><div class="label">今日失败</div></div>
        </div>
    </div>

    <div class="lines-section">
        <h3>线路分配规则（添加Bot时自动按编号分配代理IP）</h3>
        <div class="lines-grid" id="lines-display"></div>
    </div>


    <div class="check-section">
        <h3>水军自动检测（每小时自动检测Bot广告状态）
            <div>
                <span class="check-time" id="check-time">上次检测: --</span>
                <button class="btn-check-now" id="btn-manual-check" onclick="manualCheck()">立即检测</button>
            </div>
        </h3>
        <div class="check-stats">
            <div class="check-stat"><div class="num ok" id="check-ok">--</div><div class="lbl">正常</div></div>
            <div class="check-stat"><div class="num fixed" id="check-fixed">--</div><div class="lbl">已修复</div></div>
            <div class="check-stat"><div class="num failed" id="check-failed">--</div><div class="lbl">失败</div></div>
            <div class="check-stat"><div class="num" id="check-total" style="color:#00d4ff">--</div><div class="lbl">总检测</div></div>
        </div>
        <div class="check-details" id="check-details" style="display:none">
            <div style="color:#8899aa;font-size:11px;margin-bottom:5px">异常Bot详情:</div>
            <div id="check-details-list"></div>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-add" onclick="showAddModal()">+ 添加Bot（自动分配线路）</button>
        <button class="btn btn-batch" onclick="showBatchModal()">批量添加</button>
        <button class="btn btn-check" onclick="checkAll()">一键自检</button>
        <button class="btn btn-start" onclick="startAll()">▶ 一键全部运行</button>
        <button class="btn" style="background:#00bcd4;color:#fff" onclick="setProfile()">简介配置</button>
        <button class="btn btn-refresh" onclick="refreshStatus()">刷新状态</button>
        <span class="status-info" id="status-info">Bot: 0/300 | Agent: --</span>
    </div>

    <div class="bot-list">
        <h3 style="display:flex;align-items:center;gap:15px">Bot列表
            <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
                <input type="text" id="search-bot-number" placeholder="输入数字如 25 → kuaiyue25Bot" style="padding:6px 12px;border-radius:4px;border:1px solid #2c3e50;background:#0d1b2a;color:#fff;font-size:13px;width:200px">
                <button class="btn" style="padding:6px 14px;font-size:12px;background:#00d4ff;color:#000" onclick="searchBot()">搜索定位</button>
            </div>
        </h3>
        <div id="bot-container"></div>
    </div>

    <!-- 添加Bot弹窗 -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <h3>添加Bot</h3>
            <input type="text" id="add-token" placeholder="输入Bot Token (例: 123456789:AABBccDDeeFFgg...)">
            <input type="number" id="add-number" placeholder="编号（留空自动分配）" min="1" max="300">
            <div class="modal-actions">
                <button class="btn btn-refresh" onclick="closeModal('add-modal')">取消</button>
                <button class="btn btn-add" onclick="addBot()">添加</button>
            </div>
        </div>
    </div>

    <!-- 批量添加弹窗 -->
    <div class="modal" id="batch-modal">
        <div class="modal-content">
            <h3>批量添加Bot</h3>
            <textarea id="batch-tokens" placeholder="每行一个Token&#10;例:&#10;123456789:AABBccDDeeFFgg...&#10;987654321:AAHHiiJJkkLLmm..."></textarea>
            <div class="modal-actions">
                <button class="btn btn-refresh" onclick="closeModal('batch-modal')">取消</button>
                <button class="btn btn-batch" onclick="batchAdd()">批量添加</button>
            </div>
        </div>
    </div>


    <!-- Bot简介设置弹窗 -->
    <div class="modal" id="profile-modal">
        <div class="modal-content" style="max-width:550px">
            <h3 style="color:#00bcd4">Bot简介配置（自动应用到新Bot）</h3>
            <div style="margin-bottom:12px">
                <label style="color:#aaa;font-size:12px;display:block;margin-bottom:4px">Bot名称</label>
                <input type="text" id="profile-name" value="马来西亚-快约到家欢迎您" style="width:100%;padding:10px;background:#1a2332;border:1px solid #2c3e50;color:#fff;border-radius:4px">
            </div>
            <div style="margin-bottom:12px">
                <label style="color:#aaa;font-size:12px;display:block;margin-bottom:4px">Bot简介（Description）</label>
                <textarea id="profile-desc" rows="4" style="width:100%;padding:10px;background:#1a2332;border:1px solid #2c3e50;color:#fff;border-radius:4px;resize:vertical">快约到家 - 专业按摩·正规服务·安全放心
官网: www.kuaiyue.vip
频道: https://t.me/kuaiyue9
咨询: @kuaiyue777</textarea>
            </div>
            <div style="margin-bottom:12px">
                <label style="color:#aaa;font-size:12px;display:block;margin-bottom:4px">Bot短简介（About）</label>
                <input type="text" id="profile-short" value="🇲🇾 快约到家 - 专业按摩·正规服务·安全放心" style="width:100%;padding:10px;background:#1a2332;border:1px solid #2c3e50;color:#fff;border-radius:4px">
            </div>
            <div style="margin-bottom:12px">
                <label style="color:#aaa;font-size:12px;display:block;margin-bottom:4px">Bot头像图片（上传后自动分配给50个Bot）</label>
                <div style="display:flex;align-items:center;gap:10px">
                    <input type="file" id="profile-photos" multiple accept="image/*" style="color:#aaa;font-size:12px">
                    <span id="photos-info" style="color:#4caf50;font-size:12px;display:block;margin-top:5px;"></span>
                    <span id="photo-status" style="color:#666;font-size:11px">未选择文件</span>
                </div>
                <div id="photo-preview" style="margin-top:8px;display:none">
                    <img id="photo-preview-img" style="max-width:100px;max-height:100px;border-radius:50%;border:2px solid #00bcd4">
                </div>
            </div>
            <div style="margin-bottom:12px">
                <label style="color:#aaa;font-size:12px;display:block;margin-bottom:4px">分配数量（每次上传图片分配给多少个Bot）</label>
                <input type="number" id="profile-batch-size" value="50" min="1" max="300" style="width:100px;padding:8px;background:#1a2332;border:1px solid #2c3e50;color:#fff;border-radius:4px">
            </div>
            <div class="modal-actions">
                <button class="btn btn-refresh" onclick="closeModal('profile-modal')">取消</button>
                <button class="btn" style="background:#00bcd4;color:#fff" onclick="submitProfile()">确认修改</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let allBots = [];

        async function fetchAPI(url, options = {}) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);
            try {
                const resp = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(timeout);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const text = await resp.text();
                try { return JSON.parse(text); } 
                catch(e) { throw new Error('服务器返回非JSON数据'); }
            } catch(e) {
                clearTimeout(timeout);
                throw e;
            }
        }

        async function refreshStatus() {
            const container = document.getElementById('bot-container');
            container.innerHTML = '<div class="loading">加载中...</div>';
            try {
                const data = await fetchAPI(`${API_BASE}/api/status`);
                updateUI(data);
            } catch(e) {
                container.innerHTML = `<div class="error-msg">加载失败: ${e.message}</div>`;
            }
        }

        function updateUI(data) {
            // 更新统计
            const stats = data.stats || {};
            document.getElementById('stat-total').textContent = stats.total_sent || 0;
            document.getElementById('stat-today').textContent = stats.today_sent || 0;
            document.getElementById('stat-success').textContent = stats.total_success || 0;
            document.getElementById('stat-failed').textContent = stats.total_failed || 0;
            document.getElementById('stat-today-success').textContent = stats.today_success || 0;
            document.getElementById('stat-today-failed').textContent = stats.today_failed || 0;

            // 更新状态信息
            document.getElementById('status-info').textContent = 
                `Bot: ${data.total_bots || 0}/${data.max_bots || 300} | Agent: ${data.status || 'offline'}`;

            // 更新线路显示
            const linesDiv = document.getElementById('lines-display');
            let linesHTML = '';
            const lines = data.lines || {};
            for (let i = 1; i <= 10; i++) {
                const line = lines[String(i)];
                if (line) {
                    linesHTML += `<div class="line-tag line-${i}">
                        <span class="line-name">${i}号线</span>
                        <span class="line-info">编号 ${line.range_start}-${line.range_end}</span>
                        <span class="line-info">${line.proxy}</span>
                        <span class="line-info">[${line.bot_count}/${line.max_bots}]</span>
                    </div>`;
                }
            }
            linesDiv.innerHTML = linesHTML;

            // 更新Bot列表
            allBots = [];
            for (const [lineNum, line] of Object.entries(lines)) {
                if (line.bots) {
                    for (const bot of line.bots) {
                        allBots.push({ ...bot, line: lineNum });
                    }
                }
            }
            // 按编号排序
            allBots.sort((a, b) => (a.number || 0) - (b.number || 0));

            const container = document.getElementById('bot-container');
            if (allBots.length === 0) {
                container.innerHTML = '<div class="loading">暂无Bot，请添加</div>';
                return;
            }

            let html = '<div class="bot-grid">';
            for (const bot of allBots) {
                const statusClass = bot.status === 'running' ? '' : (bot.status === 'error' ? 'error' : 'stopped');
                html += `<div class="bot-card ${statusClass}" data-username="${bot.username || ''}">
                    <div class="bot-info">
                        <span class="bot-number">#${bot.name}</span>
                        <span class="bot-username">@${bot.username || bot.token_id || 'unknown'} | 线路${bot.line}</span>
                        <div class="bot-stats">发送:${bot.sent_total||0} 成功:${bot.sent_success||0} 失败:${bot.sent_failed||0}</div>
                    </div>
                    <div class="bot-actions">
                        <button class="btn-sm btn-del" onclick="removeBot('${bot.id}')">删除</button>
                    </div>
                </div>`;
            }
            html += '</div>';
            container.innerHTML = html;
        }

        async function refreshStats() {
            try {
                const data = await fetchAPI(`${API_BASE}/api/stats`);
                document.getElementById('stat-total').textContent = data.total_sent || 0;
                document.getElementById('stat-today').textContent = data.today_sent || 0;
                document.getElementById('stat-success').textContent = data.total_success || 0;
                document.getElementById('stat-failed').textContent = data.total_failed || 0;
                document.getElementById('stat-today-success').textContent = data.today_success || 0;
                document.getElementById('stat-today-failed').textContent = data.today_failed || 0;
            } catch(e) {
                alert('刷新统计失败: ' + e.message);
            }
        }

        function showAddModal() { document.getElementById('add-modal').classList.add('active'); }
        function showBatchModal() { document.getElementById('batch-modal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        async function addBot() {
            const token = document.getElementById('add-token').value.trim();
            const number = document.getElementById('add-number').value;
            if (!token) { alert('请输入Token'); return; }
            
            try {
                const data = { token };
                if (number) data.number = parseInt(number);
                const result = await fetchAPI(`${API_BASE}/api/add_bot`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if (result.error) { alert('添加失败: ' + result.error); return; }
                alert(`添加成功! 编号#${result.number} @${result.username || 'unknown'}`);
                closeModal('add-modal');
                document.getElementById('add-token').value = '';
                document.getElementById('add-number').value = '';
                refreshStatus();
            } catch(e) {
                alert('添加失败: ' + e.message);
            }
        }

        async function batchAdd() {
            const text = document.getElementById('batch-tokens').value.trim();
            if (!text) { alert('请输入Token列表'); return; }
            const tokens = text.split('\n').map(t => { t = t.trim(); if(t.includes(' ')) t = t.split(' ').pop(); return t; }).filter(t => t && t.includes(':'));
            if (tokens.length === 0) { alert('没有有效的Token'); return; }
            
            if (!confirm(`确认批量添加 ${tokens.length} 个Bot?`)) return;
            
            try {
                const result = await fetchAPI(`${API_BASE}/api/batch_add`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ tokens })
                });
                alert(`批量添加完成! 共处理 ${result.total} 个`);
                closeModal('batch-modal');
                document.getElementById('batch-tokens').value = '';
                refreshStatus();
            } catch(e) {
                alert('批量添加失败: ' + e.message);
            }
        }


        async function setProfile() {
            // 加载已保存的配置
            fetch('/api/load_profile_config').then(r=>r.json()).then(cfg => {
                if (cfg.name) document.getElementById('profile-name').value = cfg.name;
                if (cfg.description) document.getElementById('profile-desc').value = cfg.description;
                if (cfg.short_description) document.getElementById('profile-short').value = cfg.short_description;
                const infoEl = document.getElementById('photos-info');
                if (infoEl && cfg.photos_count > 0) {
                    infoEl.textContent = '已保存 ' + cfg.photos_count + ' 张图片: ' + cfg.photos.slice(0,5).join(', ') + (cfg.photos_count > 5 ? '...' : '');
                    infoEl.style.color = '#4caf50';
                }
            }).catch(()=>{});
            document.getElementById('profile-modal').style.display = 'flex';
            // 图片预览
            document.getElementById('profile-photo').onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    document.getElementById('photo-status').textContent = file.name + ' (' + (file.size/1024).toFixed(1) + 'KB)';
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        document.getElementById('photo-preview-img').src = ev.target.result;
                        document.getElementById('photo-preview').style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
            };
        }

        async function submitProfile() {
            const name = document.getElementById('profile-name').value.trim();
            const description = document.getElementById('profile-desc').value.trim();
            const short_description = document.getElementById('profile-short').value.trim();
            const photosInput = document.getElementById('profile-photos');
            const photoFiles = photosInput ? photosInput.files : [];
            
            if (!name) { alert('请填写Bot名称'); return; }
            if (!description) { alert('请填写Bot简介'); return; }
            
            // 先上传图片（如果有）
            if (photoFiles.length > 0) {
                const formData = new FormData();
                for (let i = 0; i < photoFiles.length; i++) {
                    formData.append('photos', photoFiles[i]);
                }
                try {
                    const uploadResp = await fetch('/api/upload_photos', {
                        method: 'POST',
                        body: formData
                    });
                    const uploadResult = await uploadResp.json();
                    if (uploadResult.ok) {
                        const infoEl = document.getElementById('photos-info');
                        if (infoEl) infoEl.textContent = `已上传 ${uploadResult.saved} 张图片，共 ${uploadResult.total_photos} 张`;
                    } else {
                        alert('图片上传失败: ' + (uploadResult.error || ''));
                    }
                } catch(e) {
                    alert('图片上传失败: ' + e.message);
                }
            }
            
            // 发送修改请求（后台异步执行）
            try {
                const resp = await fetch('/api/set_profile', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: name,
                        description: description,
                        short_description: short_description
                    })
                });
                const result = await resp.json();
                if (result.ok) {
                    alert('配置已保存，新Bot添加时将自动应用此配置');
                    // 保存配置到文件
                    fetch('/api/save_profile_config', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name, description, short_description})
                    });
                    closeModal('profile-modal');
                    // 开始轮询进度
                    pollProfileProgress();
                } else {
                    alert('修改失败: ' + (result.error || '未知错误'));
                }
            } catch(e) {
                alert('请求失败: ' + e.message);
            }
        }
        
        async function pollProfileProgress() {
            const interval = setInterval(async () => {
                try {
                    const resp = await fetch('/api/profile_progress');
                    const data = await resp.json();
                    const pct = Math.round((data.done / data.total) * 100);
                    document.title = `修改进度: ${pct}% (${data.done}/${data.total})`;
                    if (!data.running) {
                        clearInterval(interval);
                        document.title = '分布式机器人管理系统';
                        alert(`修改完成! 总计: ${data.total}, 成功: ${data.success}`);
                        refreshStatus();
                    }
                } catch(e) {
                    clearInterval(interval);
                }
            }, 3000);
        }
        
        function previewPhotos(input) {
            const container = document.getElementById('photos-preview');
            if (!container) return;
            container.innerHTML = '';
            const files = input.files;
            const info = document.getElementById('photos-info'); // may be null
            if (info) info.textContent = `已选择 ${files.length} 张图片`;
            for (let i = 0; i < Math.min(files.length, 10); i++) {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(files[i]);
                img.style.cssText = 'max-width:60px;max-height:60px;border-radius:4px;';
                container.appendChild(img);
            }
            if (files.length > 10) {
                const more = document.createElement('span');
                more.textContent = `+${files.length - 10}张`;
                more.style.cssText = 'color:#8899aa;align-self:center;';
                container.appendChild(more);
            }
        }
        
        async function removeBot(botId) {
            if (!confirm('确认删除此Bot?')) return;
            try {
                await fetchAPI(`${API_BASE}/api/remove_bot`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ bot_id: botId })
                });
                refreshStatus();
            } catch(e) {
                alert('删除失败: ' + e.message);
            }
        }

        async function startAll() {
            try {
                const result = await fetchAPI(`${API_BASE}/api/start_all`, { method: 'POST' });
                alert(`已启动 ${result.started} 个Bot`);
                refreshStatus();
            } catch(e) {
                alert('启动失败: ' + e.message);
            }
        }

        async function checkAll() {
            if (!confirm('开始检查所有Bot状态？这可能需要一些时间。')) return;
            try {
                document.getElementById('bot-container').innerHTML = '<div class="loading">正在检查所有Bot...</div>';
                const result = await fetchAPI(`${API_BASE}/api/check_all`, { method: 'POST' });
                alert(`检查完成! 共 ${result.results.length} 个Bot`);
                refreshStatus();
            } catch(e) {
                alert('检查失败: ' + e.message);
            }
        }

        function searchBot() {
            const keyword = document.getElementById('search-bot-number').value.trim();
            if (!keyword) { alert('请输入Bot数字编号'); return; }
            // 搜索Bot用户名中的数字（如输入25匹配 kuaiyue25Bot）
            const cards = document.querySelectorAll('.bot-card');
            let found = false;
            // 清除所有高亮
            cards.forEach(card => { card.style.outline = 'none'; });
            // 遍历查找
            for (const card of cards) {
                const username = card.getAttribute('data-username') || '';
                // 提取用户名中的数字，支持 kuaiyue25Bot 或 kuaiyue25bot
                const match = username.match(/(\d+)/);
                if (match && match[1] === keyword) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    card.style.outline = '3px solid #00d4ff';
                    card.style.outlineOffset = '2px';
                    setTimeout(() => { card.style.outline = 'none'; }, 5000);
                    found = true;
                    break;
                }
            }
            if (!found) {
                alert('未找到包含数字 ' + keyword + ' 的Bot');
            }
        }

        // 支持回车搜索
        document.getElementById('search-bot-number').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') searchBot();
        });


        // ===== 检测结果功能 =====
        async function loadCheckResult() {
            try {
                const data = await fetchAPI(`${API_BASE}/api/check_result`);
                if (data.error) {
                    document.getElementById('check-time').textContent = '上次检测: 暂无记录';
                    return;
                }
                document.getElementById('check-time').textContent = '上次检测: ' + (data.time || '--');
                document.getElementById('check-ok').textContent = data.ok || 0;
                document.getElementById('check-fixed').textContent = data.fixed || 0;
                document.getElementById('check-failed').textContent = data.failed || 0;
                document.getElementById('check-total').textContent = data.total || 0;
                
                // 显示异常Bot详情
                const details = (data.details || []).filter(d => d.status !== 'ok');
                if (details.length > 0) {
                    document.getElementById('check-details').style.display = 'block';
                    let html = '';
                    for (const d of details.slice(0, 30)) {
                        const dotClass = d.status === 'fixed' ? 'fixed' : 'failed';
                        const info = d.action || d.error || d.status;
                        html += `<div class="check-detail-item">
                            <span class="dot ${dotClass}"></span>
                            <span style="color:#00d4ff">Bot #${d.number}</span>
                            <span style="color:#ccc">${info}</span>
                        </div>`;
                    }
                    if (details.length > 30) {
                        html += `<div style="color:#8899aa;padding:4px 8px;font-size:11px">...还有 ${details.length - 30} 个</div>`;
                    }
                    document.getElementById('check-details-list').innerHTML = html;
                } else {
                    document.getElementById('check-details').style.display = 'none';
                }
            } catch(e) {
                // 静默失败
            }
        }

        async function manualCheck() {
            const btn = document.getElementById('btn-manual-check');
            btn.disabled = true;
            btn.textContent = '检测中...';
            try {
                await fetchAPI(`${API_BASE}/api/manual_check`, { method: 'POST' });
                // 等待检测完成（轮询结果）
                let attempts = 0;
                const pollInterval = setInterval(async () => {
                    attempts++;
                    try {
                        const data = await fetchAPI(`${API_BASE}/api/check_result`);
                        if (data.time && !data.error) {
                            // 检查时间是否是最近2分钟内的
                            clearInterval(pollInterval);
                            btn.disabled = false;
                            btn.textContent = '立即检测';
                            loadCheckResult();
                        }
                    } catch(e) {}
                    if (attempts > 60) { // 最多等5分钟
                        clearInterval(pollInterval);
                        btn.disabled = false;
                        btn.textContent = '立即检测';
                        loadCheckResult();
                    }
                }, 5000);
            } catch(e) {
                btn.disabled = false;
                btn.textContent = '立即检测';
                alert('触发检测失败: ' + e.message);
            }
        }

        // 页面加载时加载检测结果
        loadCheckResult();
        // 每60秒刷新检测结果
        setInterval(loadCheckResult, 60000);

        // 页面加载时自动刷新
        refreshStatus();
        // 每30秒自动刷新
        setInterval(refreshStatus, 30000);
    </script>
</body>
</html>
